[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reachability-gen"
version = "0.1.0"
description = "RESEARCH scaffold: directed-graph reachability dataset generator + FLOP/arm stubs + optional torch FF/Geo/Loop training plumbing (no science OPEN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
torch = ["torch"]

[project.scripts]
reachability-gen = "reachability_gen.generate:main"
reachability-overfit-ff = "reachability_gen.overfit_ff:main"
reachability-overfit-geo = "reachability_gen.overfit_geo:main"
reachability-train-ff-id = "reachability_gen.train_ff_id:main"
reachability-id-2k-comparison = "reachability_gen.run_id_2k_comparison:main"
reachability-id-2k-rematch = "reachability_gen.run_id_2k_rematch:main"
reachability-id-2k-rematch-fixed30 = "reachability_gen.run_id_2k_rematch_fixed30:main"
reachability-id-2k-rematch-bound30 = "reachability_gen.run_id_2k_rematch_bound30:main"
reachability-gen-ood-hops = "reachability_gen.gen_ood_hops:main"
reachability-ood-gate2 = "reachability_gen.run_ood_gate2:main"
reachability-gen-covariate-matched-ood = "reachability_gen.gen_covariate_matched_ood:main"
reachability-ood-covariate-matched = "reachability_gen.run_covariate_matched_ood:main"
reachability-overfit-fractal = "reachability_gen.overfit_fractal:main"
reachability-fractal-core-gate1 = "reachability_gen.run_fractal_core_gate1:main"
reachability-sheaf-infer-gate1 = "reachability_gen.run_sheaf_infer_gate1:main"
reachability-overfit-sheaf = "reachability_gen.overfit_sheaf:main"
reachability-sheaf-untrained-control = "reachability_gen.run_sheaf_untrained_control:main"
reachability-sheaf-neutral-init-retrain = "reachability_gen.run_sheaf_neutral_init_retrain:main"
reachability-sheaf-no-aux-edge-recon = "reachability_gen.run_sheaf_no_aux_edge_recon:main"
reachability-sheaf-ste-no-aux = "reachability_gen.run_sheaf_ste_no_aux:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: longer training / overfit checks (deselect with -m 'not slow')",
]
